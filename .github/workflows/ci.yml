name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # the project was tried on Windows only
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ReadingRoom.ArticleCMS.slnx --configuration Release

      - name: Test
        run: dotnet test ReadingRoom.ArticleCMS.slnx --configuration Release --no-build
